name: kraken
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.11

  # Geo / SAR — binary packages from conda-forge (handles GDAL system deps)
  - rasterio=1.3.10
  - gdal
  - shapely>=2.0
  - pyproj>=3.6
  - geopandas>=0.14

  # Numerical / image
  - numpy>=1.26
  - scipy>=1.12
  - pillow>=10.0

  # Utilities
  - matplotlib>=3.8
  - pandas>=2.0
  - python-dotenv>=1.0
  - tqdm>=4.66
  - pyyaml>=6.0
  - requests>=2.31

  # pip-only packages
  - pip
  - pip:
    - opencv-python-headless>=4.9.0
    - geodatasets>=0.2
    - streamlit>=1.35.0
    - folium>=0.17.0
