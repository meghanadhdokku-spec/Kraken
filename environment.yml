name: kraken
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.11

  # Geo / SAR — binary packages, must be from conda-forge on Windows
  - rasterio>=1.3
  - gdal
  - shapely>=2.0
  - pyproj>=3.6
  - geopandas>=0.14

  # Numerical / image
  - numpy>=1.26
  - scipy>=1.12
  - opencv>=4.9          # conda-forge package name
  - pillow>=10.0

  # Visualisation
  - matplotlib>=3.8

  # Utilities
  - python-dotenv>=1.0
  - tqdm>=4.66
  - pyyaml>=6.0
  - requests>=2.31

  # Jupyter (for notebooks)
  - jupyter
  - ipykernel

  # pip-only packages (no conda-forge build or better from PyPI)
  - pip
  - pip:
    - geodatasets>=0.2        # Natural Earth land polygons for land mask
    - sentinelsat>=1.3        # kept for any future use; not used in download path
    - ultralytics>=8.2        # pulls torch automatically from PyPI
